[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen"
version = "0.1.0"
description = "Narrated explainer videos in the 3Blue1Brown style: engine, scene blocks and command line of the AIVideoGenerator template."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Risorse Artificiali" }]
dependencies = [
    "manim>=0.22,<0.23",
    "edge-tts>=7.3,<8",
    "numpy>=1.26",
    "pillow>=11",
]

[project.optional-dependencies]
# Offline speech recognizer: checks that the voice says what the script says.
qa = ["faster-whisper>=1.1"]
# Reads a web article and changes it to text and figures.
extract = ["trafilatura>=1.12"]
# The speech engine omnivoice writes the numbers in words: tools/setup-omnivoice.sh installs this extra.
omnivoice = ["num2words>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
videogen = "videogen.cli:main"

[tool.setuptools.packages.find]
include = ["videogen*"]

[tool.setuptools.package-data]
videogen = ["templates/*", "templates/scenes/*", "templates/voice-test/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pipeline: runs the full pipeline on the demo video (slow)"]
